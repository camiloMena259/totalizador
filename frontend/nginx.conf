server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Esta línea es la magia: Si el usuario recarga en una ruta interna de React Router,
        # Nginx redirige internamente la petición al index.html para que React maneje la ruta en el navegador.
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}